<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-Project Netflix</title>
    <!-- CDN Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <nav class="top-bar">
            <div class="nav-left">
                <img src="https://occ.a.nflxso.net/dnmt/api/v6/iL4oJVDYZ8KLSrJ6eG2OwtghbfQ/AAAAAT4DsJqpLaLn4NdWj0hMqiS44NBBHsef6fJbMCXfInwFPyWRZWORRKIX6OoMypwFbV-skx1kkO0bw5qyPw4TGYECuHYwI_zw-n7CzjzEILCnaUNLQfmgkh-p1HzjExVEw9zDBrZd_di2.svg" alt="logo netflix" class="img-logo-netflix">
            </div>
            <div class="nav-right">
                <div class="language-dropdown">
                    <i class="bi bi-globe icon-translate"></i>
                    <select name="language" id="lang-select">
                        <option value="id">English</option>
                        <option value="">Bahasa Indonesia</option>
                    </select>
                </div>
                <a href="#" class="btn-signin">Sing In</a>
            </div>
        </nav>
        <main class="main-container">
            <div class="hero-section">
                <h1>Unlimited movies, TV</h1>
                <h1>shows, and more</h1>
                <h3>Starts at IDR 54,000. Cancel anytime.</h3>
                <span>Ready to watch? Enter your email to create or restart your membership.</span>
                <div class="email-get-start">
                    <input type="text" placeholder="Email address" >
                    <a href="#" class="btn-get-started">Get Started<i class="bi bi-chevron-right"></i></a>
                </div>
            </div>
            <div class="trending-card-container">
                <h2>Trending Now</h2>
                <div class="film-card-container">
                    <div class="flim-card">
                        <img src="https://i.pinimg.com/736x/2a/7b/1b/2a7b1b11c04de553717391a2cfa0fb6a.jpg" alt="img-film-card-trending" class="img-film-card">
                    </div>
                    <div class="flim-card">
                        <img src="https://i.pinimg.com/1200x/9a/5a/07/9a5a074d15825ba89f93cdfe2bc87de4.jpg" alt="img-film-card-trending" class="img-film-card">
                    </div>
                    <div class="flim-card">
                        <img src="https://i.pinimg.com/736x/a9/a4/a1/a9a4a1fc9625103ddf3e2ac20110dd1e.jpg" alt="img-film-card-trending" class="img-film-card">
                    </div>
                    <div class="flim-card">
                        <img src="https://i.pinimg.com/736x/e4/db/a8/e4dba8b8c72cac4496d99f090178d3c3.jpg" alt="img-film-card-trending" class="img-film-card">
                    </div>
                    <div class="flim-card">
                        <img src="https://i.pinimg.com/1200x/6a/2f/87/6a2f879cd870f9d33c94dddf1aa268ae.jpg" alt="img-film-card-trending" class="img-film-card">
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
